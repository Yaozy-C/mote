name: Release Mote

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
          - arch: Intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Mote v__VERSION__
          releaseBody: |
            Download the installer for your platform. Mote will use this release for future automatic updates.

            The macOS build is open source but is not notarized by Apple. On first launch, move Mote to Applications, then Control-click Mote and choose Open. Verify downloads against SHA256SUMS.txt.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles app,dmg

  release-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Mote v__VERSION__
          releaseBody: |
            Download the installer for your platform. Mote will use this release for future automatic updates.

            The macOS build is open source but is not notarized by Apple. On first launch, move Mote to Applications, then Control-click Mote and choose Open. Verify downloads against SHA256SUMS.txt.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          args: --target x86_64-pc-windows-msvc --bundles nsis

  release-checksums:
    name: Release checksums
    runs-on: ubuntu-latest
    needs:
      - release-macos
      - release-windows

    steps:
      - uses: actions/checkout@v7
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release download "$release_tag" --dir release-assets
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name '*.sig' ! -name 'latest.json' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > ../SHA256SUMS.txt
      - name: Upload checksum file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release upload "$release_tag" SHA256SUMS.txt --clobber
