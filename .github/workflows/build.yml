name: Build Mote

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build macOS application
        run: >-
          npx tauri build
          --target ${{ matrix.target }}
          --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: Mote-macOS-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/Mote.app
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows installer
        run: >-
          npx tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Mote-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
