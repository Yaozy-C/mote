name: Build Mote

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".github/workflows/build.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig*.json"
      - "vite.config.*"

# A release tag points at the same commit as the preceding main push. Sharing the
# concurrency group lets the later release replace that redundant app-only build.
concurrency:
  group: mote-native-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "mote-${{ matrix.target }}"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build macOS application
        run: >-
          npx tauri build
          --target ${{ matrix.target }}
          --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: Mote-macOS-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/Mote.app
          if-no-files-found: error
